# -*- conf -*-

[main]
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font Mono:size=11,Noto Color Emoji:size=11
font-bold=JetBrainsMono Nerd Font Mono:weight=bold:size=11
font-italic=JetBrainsMono Nerd Font Mono:slant=italic:size=11
font-bold-italic=JetBrainsMono Nerd Font Mono:weight=bold:slant=italic:size=11
pad=12x12

[cursor]
style=block
blink=no

[colors-dark]
# Catppuccin Mocha
foreground=cdd6f4
background=1e1e2e
cursor=1e1e2e f5e0dc
selection-foreground=1e1e2e
selection-background=f5e0dc
urls=f5e0dc

## Normal/regular colors (ANSI 0-7)
regular0=45475a # surface1
regular1=f38ba8 # red
regular2=a6e3a1 # green
regular3=f9e2af # yellow
regular4=89b4fa # blue
regular5=f5c2e7 # pink
regular6=94e2d5 # teal
regular7=bac2de # subtext1

## Bright colors (ANSI 8-15)
bright0=585b70  # surface2
bright1=f38ba8  # red
bright2=a6e3a1  # green
bright3=f9e2af  # yellow
bright4=89b4fa  # blue
bright5=f5c2e7  # pink
bright6=94e2d5  # teal
bright7=a6adc8  # subtext0
